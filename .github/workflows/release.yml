name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run all tests
        run: npm test
      - name: Count lines of source
        id: lines
        run: echo "count=$(git ls-files 'src/**/*.js' 'src/**/*.css' 'src/**/*.html' 'tests/**/*.js' | xargs cat | wc -l)" >> "$GITHUB_OUTPUT"
    outputs:
      lines: ${{ steps.lines.outputs.count }}
  windows:
    needs: test
    runs-on: windows-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Set version
        run: npm version $env:VERSION --no-git-tag-version
      - name: Build Windows installer
        run: npx electron-builder --win --publish never
      - name: Capture screenshots of the built app
        run: npx electron . --screenshots=screenshots
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            screenshots/*.png
          if-no-files-found: error
  release:
    needs: [test, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - name: Publish tagged release
        run: |
          started=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          seconds=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          (cd out/screenshots && zip -q ../screenshots.zip *.png)
          cat > notes.md <<EOF
          Automatic release of commit ${GITHUB_SHA::7}.

          - Workflow time: $((seconds / 60)) min $((seconds % 60)) s from start to release
          - Source and test lines: ${{ needs.test.outputs.lines }}
          - Screenshots of this exact build, captured on a Windows runner, are attached.

          This build has passed automated tests only. It has not been verified against a live AWS account.
          EOF
          gh release create "v$VERSION" out/dist/*.exe out/screenshots.zip --target "$GITHUB_SHA" --title "AWS App Deployer $VERSION" --notes-file notes.md
