name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run all tests
        run: npm test
      - name: Count lines of source
        id: lines
        run: echo "count=$(git ls-files 'src/**/*.js' 'src/**/*.css' 'src/**/*.html' 'tests/**/*.js' | xargs cat | wc -l)" >> "$GITHUB_OUTPUT"
    outputs:
      lines: ${{ steps.lines.outputs.count }}
  windows:
    needs: test
    runs-on: windows-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Set version
        run: npm version $env:VERSION --no-git-tag-version
      - name: Pick dim sum code name
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/code-name.mjs ${{ github.repository }} code-name.json
      - name: Stamp build provenance
        run: node scripts/stamp-build.mjs $env:VERSION code-name.json
      - name: Build Squirrel.Windows installer
        run: npx electron-builder --win --publish never
      - name: Capture screenshots of the built app
        run: npx electron . --screenshots=screenshots
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/squirrel-windows/*
            screenshots/*.png
            code-name.json
          if-no-files-found: error
  release:
    needs: [test, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - name: Publish tagged release
        run: |
          started=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          seconds=$(( $(date -u -d "$finished" +%s) - $(date -u -d "$started" +%s) ))
          (cd out/screenshots && zip -q ../screenshots.zip *.png)
          if jq -e .available out/code-name.json >/dev/null; then
            code="Code name: $(jq -r .en out/code-name.json) · $(jq -r .zh out/code-name.json) ([photo]($(jq -r .photo out/code-name.json)))"
          else
            code="No dim sum code name for this build: $(jq -r .reason out/code-name.json)."
          fi
          cat > notes.md <<EOF
          Automatic release of commit ${GITHUB_SHA::7}.

          $code

          - Workflow started $started, finished $finished UTC: $((seconds / 60)) min $((seconds % 60)) s end to end
          - Source and test lines: ${{ needs.test.outputs.lines }}
          - Installer: Squirrel.Windows (\`Setup.exe\`, \`RELEASES\`, full \`.nupkg\`). Installed copies update themselves from this release.
          - Screenshots of this exact build, captured on a Windows runner, are attached.

          These builds are unsigned. Windows may show an unknown-publisher or SmartScreen warning. This build has passed automated tests only and has not been verified against a live AWS account.
          EOF
          gh release create "v$VERSION" out/dist/squirrel-windows/* out/screenshots.zip --target "$GITHUB_SHA" --title "AWS App Deployer $VERSION" --notes-file notes.md
